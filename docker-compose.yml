version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.12
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - aiops-net

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.12
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - aiops-net

  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=aiops
      - POSTGRES_PASSWORD=aiops_pass
      - POSTGRES_DB=aiops
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aiops-net

  neo4j:
    image: neo4j:4.4
    environment:
      - NEO4J_AUTH=none
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    networks:
      - aiops-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aiops-net

  aiops:
    build:
      context: ./aiops
    image: aiops:local
    environment:
      - ELASTIC_URL=http://elasticsearch:9200
      - POSTGRES_URL=postgresql://aiops:aiops_pass@postgres:5432/aiops
      - NEO4J_URL=bolt://neo4j:7687
    ports:
      - "8000:8000"
    depends_on:
      - elasticsearch
      - postgres
      - neo4j
    networks:
      - aiops-net

volumes:
  esdata:
  pgdata:
  neo4jdata:
  qdrant_data:

networks:
  aiops-net:
    driver: bridge
